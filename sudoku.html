<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="매번 새로운 문제가 나오는 무료 스도쿠. 쉬움부터 어려움까지, 메모와 힌트 기능 지원.">
  <title>무료 스도쿠 | 틈놀</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261014a">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html"><span class="brand-mark">틈</span>틈놀</a>
      <nav id="story-nav" class="story-nav" aria-label="콘텐츠 바로가기"></nav>
    </div>
  </header>

  <div class="layout">
    <!-- 왼쪽 칸 (넓은 화면에서만 보임): 내용은 js/site.js가 채움 -->
    <aside id="left-rail" class="left-rail">
      <div id="left-content"></div>
      <div class="ad-slot ad-tall" data-slot="left"></div>
    </aside>
    <main id="app">
      <section class="puzzle-page">
        <div class="puzzle-head">
          <h1>스도쿠</h1>
          <div class="segmented level-pick">
            <button data-level="easy">쉬움</button><button data-level="medium">보통</button><button data-level="hard">어려움</button>
          </div>
        </div>
        <div class="puzzle-status">
          <span id="sd-level"></span>
          <span id="sd-mistakes"></span>
          <span>⏱ <span id="sd-time">00:00</span></span>
        </div>

        <div id="sd-grid" class="sd-grid" role="grid" aria-label="스도쿠 판"></div>

        <div id="sd-done" class="puzzle-done" hidden>
          <strong>🎉 완성!</strong>
          <p id="sd-done-text"></p>
          <div class="done-actions">
            <button id="sd-share-result" class="btn small">결과 공유하기</button>
            <button id="sd-again" class="btn small primary">새 문제</button>
          </div>
        </div>

        <div class="sd-tools">
          <button id="sd-undo" class="btn small">↶ 되돌리기</button>
          <button id="sd-erase" class="btn small">⌫ 지우기</button>
          <button id="sd-note" class="btn small">✏️ 메모</button>
          <button id="sd-hint" class="btn small">💡 힌트</button>
        </div>
        <div id="sd-pad" class="sd-pad"></div>
        <button id="sd-new" class="btn small sd-new">새 문제 (같은 난이도)</button>

        <details class="card howto">
          <summary>스도쿠 규칙</summary>
          <p>가로 줄, 세로 줄, 굵은 선으로 나뉜 3×3 상자 안에 1부터 9까지의 숫자가 한 번씩만 들어가도록 빈칸을 채우세요.</p>
          <p>칸을 누른 뒤 아래 숫자를 누르면 입력돼요. <strong>메모</strong>를 켜면 후보 숫자를 작게 적어 둘 수 있어요. 틀린 숫자는 빨갛게 표시되고, 키보드(숫자, 방향키, Backspace, N)로도 할 수 있어요.</p>
        </details>
      </section>
    </main>

    <aside id="sidebar" class="sidebar">
      <details class="card" open>
        <summary>내 기록</summary>
        <div id="sd-records" class="records"></div>
      </details>

      <details class="card" open>
        <summary>다른 콘텐츠</summary>
        <div id="more-list" class="more-list"></div>
      </details>

      <button id="btn-share" class="btn share-open">📤 친구에게 공유하기</button>

      <div class="ad-slot" data-slot="sidebar"></div>

      <details class="card">
        <summary>설정</summary>
        <div class="setting">
          <span>글자 크기</span>
          <div class="segmented" data-setting="font">
            <button data-value="sm">작게</button><button data-value="md">보통</button><button data-value="lg">크게</button>
          </div>
        </div>
        <div class="setting">
          <span>테마</span>
          <div class="segmented" data-setting="theme">
            <button data-value="auto">자동</button><button data-value="light">밝게</button><button data-value="dark">어둡게</button>
          </div>
        </div>
      </details>
    </aside>
  </div>

  <footer class="footer">
    <div class="ad-slot" data-slot="footer"></div>
    <nav>
      <a href="privacy.html">개인정보처리방침</a>
      <span aria-hidden="true">·</span>
      문의 <a href="mailto:maserati910915@gmail.com">maserati910915@gmail.com</a>
    </nav>
  </footer>

  <dialog id="share-dialog" class="share-dialog">
    <div class="share-head">
      <strong>공유하기</strong>
      <button class="share-close link" aria-label="닫기">✕</button>
    </div>
    <p class="share-preview"></p>
    <div class="share-grid"></div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="js/ads.js?v=20261014a"></script>
  <script src="js/share.js?v=20261014a"></script>
  <script src="js/catalog.js?v=20261014a"></script>
  <script src="js/site.js?v=20261014a"></script>
  <script src="js/quizzes/spelling.js?v=20261014a"></script>
  <script src="js/daily.js?v=20261014a"></script>
  <script src="js/illustrations.js?v=20261014a"></script>
  <script src="js/sudoku.js?v=20261014a"></script>
</body>
</html>
