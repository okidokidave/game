<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="스마트폰 하나로 시작해 셀럽이 되는 도트 방송 시뮬레이션. 당신의 모든 행동이 SNS에서 토론거리가 됩니다.">
  <title>인플루언서 시뮬레이터</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/influencer.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html">게임북</a>
      <nav class="story-nav" aria-label="게임 바로가기">
        <a class="story-link" href="index.html#mansion">자정의 저택</a>
        <a class="story-link" href="influencer.html" aria-current="page">인플루언서 시뮬레이터</a>
      </nav>
    </div>
  </header>

  <main class="if">
    <!-- 시작 화면 -->
    <section id="if-start">
      <div class="stage"><canvas id="preview" aria-label="내 방 미리보기"></canvas></div>
      <p class="eyebrow">도트 방송 시뮬레이션</p>
      <h1>인플루언서 시뮬레이터</h1>
      <p class="intro">스마트폰 하나로 시작해 60일 안에 셀럽이 되어 보세요.<br>당신의 모든 행동은 SNS에서 토론거리가 됩니다.</p>

      <form id="if-setup" class="setup">
        <label class="field">
          <span>방송 닉네임</span>
          <input id="in-name" maxlength="10" placeholder="방구석스타" autocomplete="off">
        </label>
        <div class="field">
          <span>머리 색</span>
          <div id="sw-hair" class="swatches"></div>
        </div>
        <div class="field">
          <span>머리 길이</span>
          <div id="sw-style" class="segmented">
            <button type="button" data-long="0">짧게</button><button type="button" data-long="1">길게</button>
          </div>
        </div>
        <div class="field">
          <span>옷 색</span>
          <div id="sw-shirt" class="swatches"></div>
        </div>
        <div class="menu">
          <button id="btn-continue" type="button" class="btn primary" hidden>이어하기</button>
          <button type="submit" class="btn">새로 시작</button>
        </div>
        <p id="ending-progress" class="muted small"></p>
      </form>
    </section>

    <!-- 게임 화면 -->
    <section id="if-game" hidden>
      <div id="hud" class="hud"></div>

      <div class="stage">
        <canvas id="room" aria-label="내 방"></canvas>
        <div id="live-badge" class="live-badge" hidden>● LIVE <span id="live-viewers"></span></div>
        <ul id="chat" class="chat" hidden></ul>
        <div id="trend-chip" class="trend-chip"></div>
        <button id="btn-phone" class="phone-btn" aria-label="SNS 열기">📱<span id="phone-badge" class="badge" hidden></span></button>
      </div>

      <div id="actions" class="actions"></div>

      <section class="log-card">
        <h3>오늘의 기록</h3>
        <ol id="log" class="log"></ol>
      </section>
    </section>
  </main>

  <!-- 모달 -->
  <div id="modal" class="if-modal" hidden>
    <div id="modal-body" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <!-- 가상 SNS -->
  <div id="phone" class="phone" hidden>
    <div class="phone-frame" role="dialog" aria-modal="true" aria-label="SNS 버즈">
      <div class="phone-status"><span>9:41</span><span>📶 🔋</span></div>
      <div class="phone-head">
        <b>🐝 버즈</b>
        <button id="phone-close" class="phone-close" aria-label="닫기">✕</button>
      </div>
      <div class="phone-tabs">
        <button data-tab="feed">타임라인</button>
        <button data-tab="trend">트렌드</button>
      </div>
      <div id="phone-body" class="phone-body"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="ad-slot" data-slot="footer"></div>
    <nav>
      <a href="privacy.html">개인정보처리방침</a>
      <span aria-hidden="true">·</span>
      문의 <a href="mailto:maserati910915@gmail.com">maserati910915@gmail.com</a>
    </nav>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <script src="js/ads.js"></script>
  <script src="js/influencer/data.js"></script>
  <script src="js/influencer/rules.js"></script>
  <script src="js/influencer/sns.js"></script>
  <script src="js/influencer/room.js"></script>
  <script src="js/influencer/game.js"></script>
</body>
</html>
