<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="간단한 질문으로 알아보는 무료 심리테스트. 결과를 친구와 공유해 보세요.">
  <title>심리테스트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html">게임북</a>
      <nav id="story-nav" class="story-nav" aria-label="콘텐츠 바로가기"></nav>
    </div>
  </header>

  <div class="layout">
    <main id="app">
      <!-- 시작 화면 -->
      <section id="intro-screen" class="screen intro-screen">
        <div id="intro-art" class="art"></div>
        <p class="eyebrow">심리테스트</p>
        <h1 id="page-title"></h1>
        <p id="page-intro" class="intro"></p>
        <div class="menu">
          <button id="btn-start" class="btn primary">시작하기</button>
        </div>
        <p id="last-result" class="last-result" hidden></p>
      </section>

      <!-- 문제 화면 -->
      <section id="question-screen" class="screen" hidden>
        <div class="q-progress"><div id="q-bar" class="bar"></div></div>
        <p id="q-count" class="q-count"></p>
        <h2 id="q-text" class="q-text"></h2>
        <div id="q-options" class="choices"></div>
        <div id="q-feedback" class="q-feedback" hidden></div>
        <button id="btn-next" class="btn primary q-next" hidden>다음 문제</button>
      </section>

      <!-- 결과 화면 -->
      <section id="result-screen" class="screen" hidden>
        <article class="scene result">
          <div id="result-art" class="art"></div>
          <div class="scene-body" id="result-body"></div>
        </article>
        <div id="result-actions" class="choices"></div>
      </section>
    </main>

    <aside id="sidebar" class="sidebar">
      <details class="card" open>
        <summary>다른 콘텐츠</summary>
        <div id="more-list" class="more-list"></div>
      </details>

      <button id="btn-share" class="btn share-open">📤 친구에게 공유하기</button>

      <div class="ad-slot" data-slot="sidebar"></div>

      <details class="card">
        <summary>설정</summary>
        <div class="setting">
          <span>글자 크기</span>
          <div class="segmented" data-setting="font">
            <button data-value="sm">작게</button><button data-value="md">보통</button><button data-value="lg">크게</button>
          </div>
        </div>
        <div class="setting">
          <span>테마</span>
          <div class="segmented" data-setting="theme">
            <button data-value="auto">자동</button><button data-value="light">밝게</button><button data-value="dark">어둡게</button>
          </div>
        </div>
      </details>
    </aside>
  </div>

  <footer class="footer">
    <div class="ad-slot" data-slot="footer"></div>
    <nav>
      <a href="privacy.html">개인정보처리방침</a>
      <span aria-hidden="true">·</span>
      문의 <a href="mailto:maserati910915@gmail.com">maserati910915@gmail.com</a>
    </nav>
  </footer>

  <dialog id="share-dialog" class="share-dialog">
    <div class="share-head">
      <strong>공유하기</strong>
      <button class="share-close link" aria-label="닫기">✕</button>
    </div>
    <p class="share-preview"></p>
    <div class="share-grid"></div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="js/ads.js"></script>
  <script src="js/share.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/site.js"></script>
  <script src="js/illustrations.js"></script>
  <!-- 테스트 파일: 새 테스트를 만들면 여기에 한 줄 추가 (예: <script src="js/tests/아이디.js"></script>) -->
  <script src="js/test-engine.js"></script>
</body>
</html>
